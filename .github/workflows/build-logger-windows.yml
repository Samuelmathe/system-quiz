name: Build quiz_logger.py (Windows .exe)

on:
  push:
    paths:
      - 'diagnostics/quiz_logger.py'
      - '.github/workflows/build-logger-windows.yml'
  workflow_dispatch: # permet aussi de lancer le build manuellement depuis l'onglet Actions

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install pyserial pyinstaller

      - name: Compilation en .exe avec PyInstaller
        run: |
          pyinstaller --onefile --windowed --name quiz_logger diagnostics/quiz_logger.py

      - name: Publication de l'exécutable
        uses: actions/upload-artifact@v4
        with:
          name: quiz_logger-windows
          path: dist/quiz_logger.exe
