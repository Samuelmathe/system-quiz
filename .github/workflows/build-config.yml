name: Build Quiz Config Mega PRO

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install dearpygui pyserial pyinstaller

      - name: Verify script imports (py_compile)
        shell: bash
        run: |
          python -m py_compile configuration/config_final_30.py

      - name: Build with PyInstaller
        shell: bash
        run: |
          pyinstaller --onefile --windowed --name="QuizConfigMegaPRO" --hidden-import=serial.tools.list_ports --hidden-import=serial.tools.list_ports_windows configuration/config_final_30.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: QuizConfigMegaPRO-Windows
          path: dist/QuizConfigMegaPRO.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install dearpygui pyserial pyinstaller

      - name: Verify script imports (py_compile)
        shell: bash
        run: |
          python -m py_compile configuration/config_final_30.py

      - name: Build with PyInstaller
        shell: bash
        run: |
          pyinstaller --onefile --windowed --name="QuizConfigMegaPRO" --hidden-import=serial.tools.list_ports --hidden-import=serial.tools.list_ports_posix configuration/config_final_30.py

      - name: Upload macOS executable
        uses: actions/upload-artifact@v4
        with:
          name: QuizConfigMegaPRO-macOS
          path: dist/QuizConfigMegaPRO

  create-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            QuizConfigMegaPRO-Windows/QuizConfigMegaPRO.exe
            QuizConfigMegaPRO-macOS/QuizConfigMegaPRO
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

