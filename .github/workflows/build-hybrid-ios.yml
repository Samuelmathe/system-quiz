name: Build Hybrid Apps (iOS, verification simulateur)

# IMPORTANT : ce build compile pour le SIMULATEUR iOS uniquement, sans
# signature (CODE_SIGNING_ALLOWED=NO). Ca prouve que le projet Capacitor
# iOS compile, mais ca NE PRODUIT PAS une app installable sur un vrai
# iPhone : ca demande un compte Apple Developer (payant) + certificats de
# signature + un Mac avec Xcode pour l'etape finale d'archivage, qu'on ne
# peut pas faire depuis cette CI. Voir docs/APK_HYBRIDE_GUIDE.md.

on:
  push:
    branches: [ main, master ]
    paths:
      - 'web/**'
      - 'hybrid-app-animateur/**'
      - 'hybrid-app-config/**'
      - '.github/workflows/build-hybrid-ios.yml'
  workflow_dispatch:

jobs:
  build-ios-simulator:
    runs-on: macos-latest
    strategy:
      matrix:
        app: [hybrid-app-animateur, hybrid-app-config]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm install

      - name: Add iOS platform
        working-directory: ${{ matrix.app }}
        run: npx cap add ios

      - name: Prepare www/ and sync into the native project
        working-directory: ${{ matrix.app }}
        run: npm run sync

      - name: Install CocoaPods dependencies
        working-directory: ${{ matrix.app }}/ios/App
        run: pod install

      - name: Build for iOS Simulator (non signe, verification uniquement)
        working-directory: ${{ matrix.app }}/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -sdk iphonesimulator -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build
